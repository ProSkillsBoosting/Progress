<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      padding: 32px clamp(16px, 4vw, 56px) 48px;
      overflow-x: auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    button {
      margin: 0 0 20px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #2563eb;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 6px 16px rgb(37 99 235 / 22%);
      transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
      box-shadow: 0 8px 20px rgb(37 99 235 / 28%);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid rgb(37 99 235 / 30%);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    table {
      width: max-content;
      min-width: 100%;
      border-spacing: 0;
      border-collapse: separate;
      border: 1px solid #dfe4ee;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 12px 32px rgb(31 41 55 / 8%);
    }

    th,
    td {
      max-width: 420px;
      padding: 13px 16px;
      border-right: 1px solid #e8ebf1;
      border-bottom: 1px solid #e8ebf1;
      text-align: left;
      vertical-align: top;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    thead th {
      position: sticky;
      z-index: 1;
      top: 0;
      color: #334155;
      background: #eef2f8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    thead th:first-child {
      border-top-left-radius: 13px;
    }

    thead th:last-child {
      border-top-right-radius: 13px;
    }

    tbody tr:nth-child(even) td {
      background: #fafbfe;
    }

    tbody tr:hover td {
      background: #f0f6ff;
    }

    @media (max-width: 640px) {
      body {
        padding: 22px 12px 32px;
      }

      th,
      td {
        max-width: 280px;
        padding: 11px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <h1>Трекер</h1>
  <button type="button" id="refresh">Обновить</button>
  <table aria-live="polite">
    <thead></thead>
    <tbody><tr><td>Загрузка…</td></tr></tbody>
  </table>

  <script>
    const PUBLIC_KEY = "https://disk.yandex.ru/i/1IK4U63YT280oQ";
    const DOWNLOAD_API = "https://cloud-api.yandex.net/v1/disk/public/resources/download";

    const button = document.querySelector("#refresh");
    const tableHead = document.querySelector("thead");
    const tableBody = document.querySelector("tbody");
    const frame = document.createElement("iframe");
    let frameReady = false;
    let activeRequest = 0;

    frame.hidden = true;
    frame.setAttribute("sandbox", "allow-scripts");
    frame.srcdoc = `<!doctype html><meta charset="utf-8"><script>
      addEventListener("message", async (event) => {
        const data = event.data;
        if (!data || data.type !== "load-excel") return;

        try {
          const apiUrl = new URL(data.downloadApi);
          apiUrl.searchParams.set("public_key", data.publicKey);
          apiUrl.searchParams.set("_", Date.now());

          const linkResponse = await fetch(apiUrl);
          if (!linkResponse.ok) {
            throw new Error("Не удалось получить ссылку на файл (HTTP " + linkResponse.status + ")");
          }

          const linkData = await linkResponse.json();
          if (!linkData.href) throw new Error("Яндекс Диск не вернул ссылку на файл");

          const fileResponse = await fetch(linkData.href);
          if (!fileResponse.ok) {
            throw new Error("Не удалось скачать файл (HTTP " + fileResponse.status + ")");
          }

          const buffer = await fileResponse.arrayBuffer();
          parent.postMessage(
            { type: "excel-loaded", requestId: data.requestId, buffer },
            "*",
            [buffer]
          );
        } catch (error) {
          parent.postMessage({
            type: "excel-error",
            requestId: data.requestId,
            message: error instanceof Error ? error.message : String(error)
          }, "*");
        }
      });

      parent.postMessage({ type: "excel-frame-ready" }, "*");
    <\/script>`;
    document.body.append(frame);

    function showError(message) {
      tableHead.replaceChildren();
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.textContent = "Ошибка: " + message;
      row.append(cell);
      tableBody.replaceChildren(row);
    }

    function cellText(worksheet, row, column) {
      const cell = worksheet[XLSX.utils.encode_cell({ r: row, c: column })];
      return cell ? XLSX.utils.format_cell(cell) : "";
    }

    function renderWorkbook(buffer) {
      const workbook = XLSX.read(buffer, { type: "array" });
      const firstSheetName = workbook.SheetNames[0];
      if (!firstSheetName) throw new Error("В Excel-файле нет листов");

      const worksheet = workbook.Sheets[firstSheetName];
      if (!worksheet["!ref"]) throw new Error("Первый лист пуст");

      const range = XLSX.utils.decode_range(worksheet["!ref"]);
      const headerRow = document.createElement("tr");

      for (let column = range.s.c; column <= range.e.c; column += 1) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = cellText(worksheet, range.s.r, column);
        headerRow.append(cell);
      }

      const bodyFragment = document.createDocumentFragment();
      for (let row = range.s.r + 1; row <= range.e.r; row += 1) {
        const tableRow = document.createElement("tr");
        for (let column = range.s.c; column <= range.e.c; column += 1) {
          const cell = document.createElement("td");
          cell.textContent = cellText(worksheet, row, column);
          tableRow.append(cell);
        }
        bodyFragment.append(tableRow);
      }

      tableHead.replaceChildren(headerRow);
      tableBody.replaceChildren(bodyFragment);
    }

    function refresh() {
      if (!frameReady) return;
      activeRequest += 1;
      button.disabled = true;
      frame.contentWindow.postMessage({
        type: "load-excel",
        requestId: activeRequest,
        publicKey: PUBLIC_KEY,
        downloadApi: DOWNLOAD_API
      }, "*");
    }

    addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow || event.origin !== "null" || !event.data) return;

      if (event.data.type === "excel-frame-ready") {
        frameReady = true;
        refresh();
        return;
      }

      if (event.data.requestId !== activeRequest) return;

      if (event.data.type === "excel-loaded") {
        try {
          renderWorkbook(event.data.buffer);
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        } finally {
          button.disabled = false;
        }
      } else if (event.data.type === "excel-error") {
        showError(event.data.message || "Неизвестная ошибка");
        button.disabled = false;
      }
    });

    button.addEventListener("click", refresh);
  </script>
</body>
</html>
