<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f6f7f9;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: #f6f7f9;
    }

    main {
      width: min(100%, 1600px);
      margin: 0 auto;
      padding: 28px clamp(20px, 2.2vw, 32px) 32px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    .header-actions { display: flex; align-items: center; gap: 14px; }
    .updated-at { color: #737373; font-size: 12px; white-space: nowrap; }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.1vw, 30px);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    p {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.4;
    }

    button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      color: #111827;
      background: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 1px 2px rgb(17 24 39 / 5%);
      transition: background-color 170ms ease, border-color 170ms ease, transform 170ms ease;
    }

    button:hover:not(:disabled) {
      border-color: #b9bdc5;
      background: #fffbea;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid rgb(255 212 0 / 42%);
      outline-offset: 3px;
    }

    button:disabled { cursor: wait; opacity: .72; }

    .refresh-icon {
      display: inline-block;
      font-size: 18px;
      line-height: 1;
    }

    button.is-loading .refresh-icon { animation: spin .8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .analytics {
      display: flex;
      align-items: stretch;
      margin: -4px 0 16px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      background: rgb(255 255 255 / 72%);
    }

    .metric {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: baseline;
      gap: 7px;
      padding: 11px 16px;
      border-right: 1px solid #eceef1;
    }

    .metric:last-child { border-right: 0; }
    .metric-label { color: #737373; font-size: 11px; font-weight: 550; }
    .metric-value { overflow: hidden; color: #171717; font-size: 14px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .metric.leader .metric-value { color: #166534; }
    .metric.leader .metric-value::before { margin-right: 6px; color: #16a34a; content: "●"; font-size: 7px; vertical-align: 2px; }

    .table-card {
      position: relative;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 5px 18px rgb(17 24 39 / 4%);
    }

    .table-card::after {
      position: absolute;
      z-index: 8;
      top: 0;
      right: 94px;
      bottom: 8px;
      width: 22px;
      pointer-events: none;
      background: linear-gradient(to right, transparent, rgb(17 24 39 / 8%));
      opacity: 1;
      transition: opacity 180ms ease;
      content: "";
    }

    .table-card.is-at-end::after { opacity: 0; }

    .table-scroll {
      max-width: 100%;
      max-height: calc(100vh - 188px);
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #c9cdd4 transparent;
      overscroll-behavior: contain;
    }

    .table-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-scroll::-webkit-scrollbar-thumb { border: 2px solid #fff; border-radius: 99px; background: #c9cdd4; }
    .table-scroll::-webkit-scrollbar-track { background: transparent; }

    table {
      width: max-content;
      min-width: 100%;
      border-spacing: 0;
      border-collapse: separate;
      table-layout: fixed;
      background: #fff;
    }

    th, td {
      min-width: 78px;
      height: 46px;
      padding: 10px 12px;
      border-right: 1px solid transparent;
      border-bottom: 1px solid #eff0f2;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      transition: background-color 160ms ease;
    }

    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }

    thead th {
      position: sticky;
      z-index: 4;
      top: 0;
      height: 46px;
      color: #4b5563;
      background: #f3f4f6;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .015em;
    }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      min-width: 210px;
      width: 210px;
      max-width: 230px;
      border-right-color: #dfe2e6;
      text-align: left;
      background: #fbfbfc;
    }

    thead th:first-child {
      z-index: 6;
      background: #eef0f3;
    }

    tbody td:first-child {
      z-index: 2;
      color: #1f2937;
      font-size: 14px;
      font-weight: 560;
      box-shadow: 3px 0 6px rgb(17 24 39 / 2%);
    }

    tbody tr:hover td { background: #faf8ee; }
    tbody tr:hover td:first-child { background: #f8f5e8; }
    tbody td:not(:first-child):hover { background: #fff7cc; }
    th.is-column-hover, td.is-column-hover { background: #faf8ee; }
    thead th.is-column-hover { background: #eaecef; }

    .employee-number {
      display: inline-block;
      min-width: 28px;
      margin-right: 8px;
      color: #9ca3af;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .value-badge {
      display: inline-grid;
      min-width: 27px;
      height: 26px;
      padding: 0 7px;
      place-items: center;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      color: #4b5563;
      background: #f7f7f8;
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .value-badge.is-one { color: #374151; background: #f1f2f4; }
    .value-badge.is-high { border-color: #ead77a; color: #3f3500; background: #fff6c4; }
    .value-badge.is-very-high { border-color: #dfc33f; background: #ffed85; }

    th.is-total, td.is-total {
      position: sticky;
      z-index: 3;
      right: 0;
      min-width: 94px;
      width: 94px;
      border-left: 1px solid #dedfe2;
      color: #171717;
      background: #f7f7f5;
      font-size: 14px;
      font-weight: 720;
      box-shadow: -4px 0 8px rgb(17 24 39 / 3%);
    }

    thead th.is-total { z-index: 7; color: #3f3f46; background: #e9eaec; font-size: 12px; }
    tbody tr:hover td.is-total { background: #f2f0e5; }
    td.is-top-employee { color: #166534; background: #ecfdf3; }
    tbody tr:hover td.is-top-employee { background: #e1f9eb; }

    .rank-badge {
      display: inline-grid;
      width: 24px;
      height: 24px;
      margin-right: 9px;
      place-items: center;
      border: 1px solid #bbebcd;
      border-radius: 7px;
      color: #166534;
      background: #fff;
      font-size: 11px;
      font-weight: 750;
    }

    .is-today { background: #fff9dc !important; }
    thead .is-today::after {
      display: block;
      width: 5px;
      height: 5px;
      margin: 4px auto -5px;
      border-radius: 50%;
      background: #e6b800;
      content: "";
    }

    .state-cell {
      position: static !important;
      width: auto !important;
      min-width: min(720px, calc(100vw - 64px)) !important;
      max-width: none !important;
      height: 116px;
      color: #6b7280;
      text-align: center !important;
      white-space: normal;
    }

    @media (max-width: 720px) {
      main { padding: 20px 12px 24px; }
      header { align-items: center; gap: 12px; }
      .header-actions { align-items: flex-end; flex-direction: column-reverse; gap: 5px; }
      .analytics { flex-wrap: wrap; }
      .metric { flex: 1 1 50%; }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n + 2) { border-bottom: 1px solid #eceef1; }
      p { font-size: 13px; }
      button { padding-inline: 11px; }
      .table-scroll { max-height: calc(100vh - 204px); }
      th:first-child, td:first-child { min-width: 184px; width: 184px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      button.is-loading .refresh-icon { animation-duration: 1.6s; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Progress Tracker</h1>
        <p>Мониторинг выполнения работ</p>
      </div>
      <div class="header-actions">
        <span class="updated-at" id="updated-at" aria-live="polite"></span>
        <button type="button" id="refresh" aria-label="Обновить данные">
          <span class="refresh-icon" aria-hidden="true">↻</span>
          <span class="button-label">Обновить</span>
        </button>
      </div>
    </header>
    <section class="analytics" aria-label="Краткая аналитика">
      <div class="metric"><span class="metric-label">Обучающиеся</span><span class="metric-value" id="employee-count">—</span></div>
      <div class="metric"><span class="metric-label">Количество уроков</span><span class="metric-value" id="date-count">—</span></div>
      <div class="metric leader"><span class="metric-label">Лидер</span><span class="metric-value" id="leader">—</span></div>
      <div class="metric"><span class="metric-label">Лучший результат</span><span class="metric-value" id="best-result">—</span></div>
    </section>
    <section class="table-card" aria-label="Таблица прогресса">
      <div class="table-scroll" tabindex="0" role="region" aria-label="Прокручиваемая таблица прогресса">
        <table aria-live="polite">
          <thead></thead>
          <tbody><tr><td class="state-cell">Загружаем данные…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const PUBLIC_KEY = "https://disk.yandex.ru/i/1IK4U63YT280oQ";
    const DOWNLOAD_API = "https://cloud-api.yandex.net/v1/disk/public/resources/download";

    const button = document.querySelector("#refresh");
    const buttonLabel = button.querySelector(".button-label");
    const tableHead = document.querySelector("thead");
    const tableBody = document.querySelector("tbody");
    const tableScroll = document.querySelector(".table-scroll");
    const tableCard = document.querySelector(".table-card");
    const updatedAt = document.querySelector("#updated-at");
    const employeeCount = document.querySelector("#employee-count");
    const dateCount = document.querySelector("#date-count");
    const leader = document.querySelector("#leader");
    const bestResult = document.querySelector("#best-result");
    const frame = document.createElement("iframe");
    let frameReady = false;
    let activeRequest = 0;
    let buttonResetTimer;

    frame.hidden = true;
    frame.setAttribute("sandbox", "allow-scripts");
    frame.srcdoc = `<!doctype html><meta charset="utf-8"><script>
      addEventListener("message", async (event) => {
        const data = event.data;
        if (!data || data.type !== "load-excel") return;

        try {
          const apiUrl = new URL(data.downloadApi);
          apiUrl.searchParams.set("public_key", data.publicKey);
          apiUrl.searchParams.set("_", Date.now());

          const linkResponse = await fetch(apiUrl);
          if (!linkResponse.ok) {
            throw new Error("Не удалось получить ссылку на файл (HTTP " + linkResponse.status + ")");
          }

          const linkData = await linkResponse.json();
          if (!linkData.href) throw new Error("Яндекс Диск не вернул ссылку на файл");

          const fileResponse = await fetch(linkData.href);
          if (!fileResponse.ok) {
            throw new Error("Не удалось скачать файл (HTTP " + fileResponse.status + ")");
          }

          const buffer = await fileResponse.arrayBuffer();
          parent.postMessage(
            { type: "excel-loaded", requestId: data.requestId, buffer },
            "*",
            [buffer]
          );
        } catch (error) {
          parent.postMessage({
            type: "excel-error",
            requestId: data.requestId,
            message: error instanceof Error ? error.message : String(error)
          }, "*");
        }
      });

      parent.postMessage({ type: "excel-frame-ready" }, "*");
    <\/script>`;
    document.body.append(frame);

    function showError(message) {
      const columnCount = Math.max(1, tableHead.querySelectorAll("th").length);
      tableHead.replaceChildren();
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.className = "state-cell";
      cell.colSpan = columnCount;
      cell.textContent = "Ошибка: " + message;
      row.append(cell);
      tableBody.replaceChildren(row);
      employeeCount.textContent = "—";
      dateCount.textContent = "—";
      leader.textContent = "—";
      bestResult.textContent = "—";
    }

    function cellText(worksheet, row, column) {
      const cell = worksheet[XLSX.utils.encode_cell({ r: row, c: column })];
      return cell ? XLSX.utils.format_cell(cell) : "";
    }

    function dateFromCell(cell) {
      if (!cell) return null;
      if (cell.t === "d" && cell.v instanceof Date) return cell.v;
      if (cell.t !== "n" || !cell.z || !XLSX.SSF.is_date(cell.z)) return null;
      const parts = XLSX.SSF.parse_date_code(cell.v);
      return parts ? new Date(parts.y, parts.m - 1, parts.d) : null;
    }

    function dateFromText(value) {
      const text = value.trim();
      let match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
      if (match) {
        const year = Number(match[3]) + (match[3].length === 2 ? 2000 : 0);
        return new Date(year, Number(match[1]) - 1, Number(match[2]));
      }
      match = text.match(/^(\d{1,2})[.](\d{1,2})(?:[.](\d{2}|\d{4}))?$/);
      if (!match) return null;
      const currentYear = new Date().getFullYear();
      const year = match[3] ? Number(match[3]) + (match[3].length === 2 ? 2000 : 0) : currentYear;
      return new Date(year, Number(match[2]) - 1, Number(match[1]));
    }

    function isToday(date) {
      const today = new Date();
      return date && date.getFullYear() === today.getFullYear()
        && date.getMonth() === today.getMonth()
        && date.getDate() === today.getDate();
    }

    function renderHeaderCell(worksheet, row, column, element) {
      const sourceCell = worksheet[XLSX.utils.encode_cell({ r: row, c: column })];
      const originalText = cellText(worksheet, row, column);
      const date = dateFromCell(sourceCell) || dateFromText(originalText);
      element.dataset.isDate = String(Boolean(date));
      element.textContent = date
        ? new Intl.DateTimeFormat("ru-RU", { day: "2-digit", month: "2-digit" }).format(date)
        : cellText(worksheet, row, column);
      if (isToday(date)) {
        element.classList.add("is-today");
        element.setAttribute("aria-label", element.textContent + ", сегодня");
      }
    }

    function renderEmployeeCell(element, value) {
      const match = value.match(/^(\d{1,3})[.)]?\s+(.+)$/);
      if (!match) {
        element.textContent = value;
        return;
      }
      element.textContent = match[2];
    }

    function renderValueCell(element, value) {
      if (!/^-?\d+(?:[.,]\d+)?$/.test(value.trim())) {
        element.textContent = value;
        return;
      }
      const numericValue = Number(value.replace(",", "."));
      const badge = document.createElement("span");
      badge.className = "value-badge";
      if (numericValue === 1) badge.classList.add("is-one");
      if (numericValue >= 2) badge.classList.add("is-high");
      if (numericValue >= 4) badge.classList.add("is-very-high");
      badge.textContent = value;
      element.append(badge);
    }

    function setLoadingState() {
      clearTimeout(buttonResetTimer);
      button.disabled = true;
      button.classList.add("is-loading");
      buttonLabel.textContent = "Обновляем";
    }

    function finishLoading(success) {
      button.disabled = false;
      button.classList.remove("is-loading");
      buttonLabel.textContent = success ? "Обновлено" : "Обновить";
      if (success) {
        updatedAt.textContent = "Обновлено " + new Intl.DateTimeFormat("ru-RU", {
          hour: "2-digit", minute: "2-digit"
        }).format(new Date());
        buttonResetTimer = setTimeout(() => { buttonLabel.textContent = "Обновить"; }, 1800);
      }
    }

    function numericValue(value) {
      const normalized = value.replace(/[\s\u00a0]/g, "").replace(",", ".");
      if (!/^-?\d+(?:\.\d+)?$/.test(normalized)) return null;
      const result = Number(normalized);
      return Number.isFinite(result) ? result : null;
    }

    function employeeName(value) {
      const match = value.trim().match(/^\d{1,3}[.)]?\s+(.+)$/);
      return match ? match[1] : value.trim();
    }

    function updateScrollHint() {
      const atEnd = tableScroll.scrollLeft + tableScroll.clientWidth >= tableScroll.scrollWidth - 2;
      tableCard.classList.toggle("is-at-end", atEnd || tableScroll.scrollWidth <= tableScroll.clientWidth);
    }

    function updateDashboardUI(rows, headers) {
      const datedHeaders = headers.filter((header, index) => index > 0 && index < headers.length - 1 && header.dataset.isDate === "true");
      const ranked = rows.filter(item => item.score !== null)
        .slice()
        .sort((a, b) => b.score - a.score || a.index - b.index);

      const topFour = ranked.slice(0, 4);
      const topFourSet = new Set(topFour);
      const remaining = rows.filter(item => !topFourSet.has(item)).sort((a, b) =>
        employeeName(a.name).localeCompare(employeeName(b.name), "ru", { sensitivity: "base" })
      );
      const employeeRowSet = new Set(rows.map(item => item.tableRow));
      const serviceRows = [...tableBody.rows].filter(row => !employeeRowSet.has(row));
      tableBody.replaceChildren(
        ...topFour.map(item => item.tableRow),
        ...remaining.map(item => item.tableRow),
        ...serviceRows
      );

      topFour.forEach((item, index) => {
        item.employeeCell.classList.add("is-top-employee");
        const rank = document.createElement("span");
        rank.className = "rank-badge";
        rank.textContent = String(index + 1);
        rank.setAttribute("aria-label", "Место " + (index + 1));
        item.employeeCell.prepend(rank);
      });

      employeeCount.textContent = String(rows.length);
      dateCount.textContent = String(datedHeaders.length);
      leader.textContent = ranked.length ? employeeName(ranked[0].name) + " · " + ranked[0].displayScore : "—";
      bestResult.textContent = ranked.length ? ranked[0].displayScore : "—";
      requestAnimationFrame(() => {
        tableScroll.scrollTop = 0;
        tableScroll.scrollLeft = 0;
        updateScrollHint();
      });
    }

    function renderWorkbook(buffer) {
      const workbook = XLSX.read(buffer, { type: "array" });
      const firstSheetName = workbook.SheetNames[0];
      if (!firstSheetName) throw new Error("В Excel-файле нет листов");

      const worksheet = workbook.Sheets[firstSheetName];
      if (!worksheet["!ref"]) throw new Error("Первый лист пуст");

      const range = XLSX.utils.decode_range(worksheet["!ref"]);
      const headerRow = document.createElement("tr");
      const employeeRows = [];

      for (let column = range.s.c; column <= range.e.c; column += 1) {
        const cell = document.createElement("th");
        cell.scope = "col";
        renderHeaderCell(worksheet, range.s.r, column, cell);
        if (column === range.s.c && !cell.textContent.trim()) cell.textContent = "Сотрудник";
        if (column === range.e.c) {
          cell.classList.add("is-total");
          if (!cell.textContent.trim()) cell.textContent = "Итого";
        }
        headerRow.append(cell);
      }

      const bodyFragment = document.createDocumentFragment();
      for (let row = range.s.r + 1; row <= range.e.r; row += 1) {
        const tableRow = document.createElement("tr");
        const name = cellText(worksheet, row, range.s.c);
        let employeeCell;
        let displayScore = "";
        for (let column = range.s.c; column <= range.e.c; column += 1) {
          const cell = document.createElement("td");
          const value = cellText(worksheet, row, column);
          if (column === range.s.c) {
            employeeCell = cell;
            renderEmployeeCell(cell, value);
          } else if (column === range.e.c) {
            cell.textContent = value;
          } else {
            renderValueCell(cell, value);
          }
          if (column === range.e.c) {
            cell.classList.add("is-total");
            displayScore = value;
          }
          if (headerRow.children[column - range.s.c].classList.contains("is-today")) {
            cell.classList.add("is-today");
          }
          if (column > range.s.c && name.trim()) {
            const header = headerRow.children[column - range.s.c].textContent.trim();
            cell.title = employeeName(name) + (header ? " × " + header : "");
          }
          tableRow.append(cell);
        }
        if (/^\d{1,3}[.)]?\s+\S/.test(name.trim())) {
          employeeRows.push({
            index: employeeRows.length,
            name,
            tableRow,
            employeeCell,
            score: numericValue(displayScore),
            displayScore
          });
        }
        bodyFragment.append(tableRow);
      }

      tableHead.replaceChildren(headerRow);
      tableBody.replaceChildren(bodyFragment);
      updateDashboardUI(employeeRows, [...headerRow.children]);
    }

    function refresh() {
      if (!frameReady) return;
      activeRequest += 1;
      setLoadingState();
      frame.contentWindow.postMessage({
        type: "load-excel",
        requestId: activeRequest,
        publicKey: PUBLIC_KEY,
        downloadApi: DOWNLOAD_API
      }, "*");
    }

    addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow || event.origin !== "null" || !event.data) return;

      if (event.data.type === "excel-frame-ready") {
        frameReady = true;
        refresh();
        return;
      }

      if (event.data.requestId !== activeRequest) return;

      if (event.data.type === "excel-loaded") {
        let rendered = false;
        try {
          renderWorkbook(event.data.buffer);
          rendered = true;
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        } finally {
          finishLoading(rendered);
        }
      } else if (event.data.type === "excel-error") {
        showError(event.data.message || "Неизвестная ошибка");
        finishLoading(false);
      }
    });

    tableScroll.addEventListener("scroll", updateScrollHint, { passive: true });
    tableScroll.addEventListener("pointerover", (event) => {
      const cell = event.target.closest("th, td");
      if (!cell || !cell.parentElement) return;
      const column = cell.cellIndex;
      document.querySelectorAll(".is-column-hover").forEach(item => item.classList.remove("is-column-hover"));
      document.querySelectorAll("tr").forEach(row => {
        if (row.cells[column]) row.cells[column].classList.add("is-column-hover");
      });
    });
    tableScroll.addEventListener("pointerleave", () => {
      document.querySelectorAll(".is-column-hover").forEach(item => item.classList.remove("is-column-hover"));
    });

    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    button.addEventListener("click", refresh);
  </script>
</body>
</html>
